[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tfcg-charcoal-model"
version = "0.1.0"
description = "Reproducibility audit and explicit model experiments for community charcoal planning at Ulaya Mbuyuni"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2,<3", "pandas>=2.2,<4", "rasterio>=1.4,<2", "scipy>=1.15,<2", "matplotlib>=3.10,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
